spring:
  application:
    name: travel-journal-backend

  # Database Connection Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/travel_journal_db
    username: travel_journal_user
    password: travel_journal
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: travel_journal_schema
        format_sql: true

# Server Configuration
server:
  port: 8080